name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A tag re-pushed after deletion (a botched release, re-cut under the same
# vX.Y.Z) must not run a second build/publish alongside one already in
# flight: two concurrent `gh release create` calls for the same tag could
# race, and cancelling a release mid-`gh release create` is worse than
# queuing — the queued run's own `gh release create` simply fails loudly
# ("release already exists") once the first finishes, instead of leaving a
# partially-published release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: verify tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag, workspace, and plugin manifest versions must match exactly
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p' Cargo.toml | head -n1)
          PLUGIN_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p' herdr-plugin.toml | head -n1)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION must equal workspace version ($CARGO_VERSION) and herdr-plugin.toml version ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "tag v$TAG_VERSION matches workspace and plugin manifest versions"

  build:
    name: build (${{ matrix.target }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: scripts/build.sh "${{ matrix.target }}"

      - name: Package archive and checksum
        run: |
          set -eu
          ARCHIVE="multiverse-${{ matrix.target }}.tar.gz"
          BIN="target/${{ matrix.target }}/release/multiverse"
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/multiverse"
          chmod +x "$STAGE/multiverse"
          COPYFILE_DISABLE=1 tar -C "$STAGE" -czf "$ARCHIVE" multiverse
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          rm -rf "$STAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            multiverse-${{ matrix.target }}.tar.gz
            multiverse-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  provenance:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

  release:
    name: publish release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Build aggregate SHA256SUMS
        run: |
          set -eu
          cd dist
          cat -- *.sha256 > SHA256SUMS
          rm -f -- *.sha256

      - name: Extract changelog notes for this version
        id: notes
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0) { found = 1; next }
                next
              }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            printf "Release %s.\n" "$GITHUB_REF_NAME" > "$NOTES_FILE"
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            dist/*
